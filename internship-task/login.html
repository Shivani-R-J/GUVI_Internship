<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Login - AI & ML Program</title>
</head>
<body>
  <div class="split-layout">
    <div class="split-left d-flex">
      <div class="left-content">
        <h1 class="brand-title">GUVI | <span class="fw-light">Internship</span></h1>
        <h2 class="program-title">Welcome back to your learning journey!</h2>
        <p class="mt-4 text-light opacity-75">Sign in to continue exploring the Web Development Internship Program and building amazing projects.</p>
      </div>
      <div class="tech-overlay"></div>
    </div>
    
    <div class="split-right">
      <div class="form-container">
        <h3 class="form-heading">Sign In</h3>
        <p class="text-muted mb-4">Welcome back! Please enter your details.</p>
        
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control custom-input" placeholder="Enter your email">
        </div>
        
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control custom-input" placeholder="Enter your password">
        </div>
        
        <button id="loginBtn" class="btn btn-brand w-100">Sign In</button>
        <p class="mt-4 text-center">Don't have an account? <a href="register.html" class="brand-link">Sign Up</a></p>
      </div>
    </div>
  </div>
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

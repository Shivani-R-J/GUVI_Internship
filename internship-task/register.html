<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Register - AI & ML Program</title>
</head>
<body>
  <div class="split-layout">
    <div class="split-left d-flex">
      <div class="left-content">
        <h1 class="brand-title">GUVI | <span class="fw-light">Internship</span></h1>
        <h2 class="program-title">Web Development Internship Program</h2>
        <ul class="feature-list mt-4">
          <li><span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M13.5 3a.5.5 0 0 1 .5.5V11H2V3.5a.5.5 0 0 1 .5-.5h11zm-11-1A1.5 1.5 0 0 0 1 3.5V12h14V3.5A1.5 1.5 0 0 0 13.5 2h-11zM0 12.5h16a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 12.5z"/></svg></span> Real-World Project Building</li>
          <li><span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M10.478 1.647a.5.5 0 1 0-.956-.294l-4 13a.5.5 0 0 0 .956.294l4-13zM4.854 4.146a.5.5 0 0 1 0 .708L1.707 8l3.147 3.146a.5.5 0 0 1-.708.708l-3.5-3.5a.5.5 0 0 1 0-.708l3.5-3.5a.5.5 0 0 1 .708 0zm6.292 0a.5.5 0 0 0 0 .708L14.293 8l-3.147 3.146a.5.5 0 0 0 .708.708l3.5-3.5a.5.5 0 0 0 0-.708l-3.5-3.5a.5.5 0 0 0-.708 0z"/></svg></span> MERN Stack Mastery</li>
          <li><span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M8 8c.828 0 1.5-.895 1.5-2S8 4 8 4s-1.5 1.105-1.5 2S7.172 8 8 8Z"/><path d="M11.953 8.81c-.195-3.388-.968-5.507-2.762-6.549A9.263 9.263 0 0 0 8 2c-.69 0-1.398.053-2.19.16-1.795 1.042-2.568 3.161-2.763 6.55-.007.128-.014.256-.02.384v.355c0 .358.12.71.34 1.006l.872 1.168c.176.236.42.416.702.518l.848.307v2.247c0 .114.053.221.144.288l1.71 1.258a.5.5 0 0 0 .717-.113l1.103-1.543a3.42 3.42 0 0 0 .193-.306l.85-.307c.282-.102.526-.282.702-.518l.872-1.168a1.867 1.867 0 0 0 .34-1.006v-.355c-.006-.128-.013-.256-.02-.384ZM8 3.5a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm.966 6.505a.498.498 0 0 1-.36.145H7.394a.498.498 0 0 1-.36-.145L6.34 8.718a.498.498 0 0 1-.144-.356V8.16l.115-3.326a8.212 8.212 0 0 1 3.377 0l.115 3.326c0 .132-.053.258-.144.356l-.693 1.287Z"/></svg></span> Career Placement Support</li>
        </ul>
      </div>
      <div class="tech-overlay"></div>
    </div>
    
    <div class="split-right">
      <div class="form-container">
        <h3 class="form-heading">Create your account</h3>
        <p class="text-muted mb-4">Or Sign Up with Email</p>
        
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" id="username" class="form-control custom-input" placeholder="Enter your full name">
        </div>
        
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control custom-input" placeholder="Enter your email">
        </div>
        
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control custom-input" placeholder="Create a strong password">
        </div>
        
        <button id="registerBtn" class="btn btn-brand w-100">Sign Up</button>
        <p class="mt-4 text-center">Already have an account? <a href="login.html" class="brand-link">Sign in here</a></p>
      </div>
    </div>
  </div>
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
